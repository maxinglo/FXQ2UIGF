# .github/workflows/release.yml

name: Create Release with Executable

# 触发条件：当一个以 'v' 开头的标签被推送到仓库时
on:
  push:
    tags:
      - 'v*' # 例如 v1.0, v2.1.3

jobs:
  build-and-release:
    # 指定运行环境为最新的 Windows 服务器
    runs-on: windows-latest

    steps:
      # 第一步：检出（下载）你的仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 第二步：设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 第三步：安装依赖库
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 第四步：使用 PyInstaller 打包 .exe 文件
      - name: Build executable with PyInstaller
        run: |
          pyinstaller --name "fxq2UIGF" --onefile --console main.py

      # 第五步：创建 GitHub Release 并上传 .exe 文件
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          # files: 指定要上传的文件路径。支持通配符。
          files: dist/fxq2UIGF.exe
          # name: Release 的标题，这里使用标签名作为标题
          name: Release ${{ github.ref_name }}
          # body: Release 的描述内容
          body: |
            这是 fxq2UIGF 转换器的自动发布版本。
            从下面的 Assets 下载 Windows 可执行文件。
          # prerelease: 如果标签名包含 "beta", "alpha", or "rc"，则标记为预发布版本
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
        env:
          # GITHUB_TOKEN 是 GitHub Actions 自动提供的，用于授权创建 Release
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
